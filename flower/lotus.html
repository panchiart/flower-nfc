<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荷花 · 听花语</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* 荷花页面专属样式 */
        .flower-page {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            border-radius: 0;
            overflow: hidden;
        }

        .flower-hero {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 60px 30px;
            text-align: center;
            color: white;
            position: relative;
        }

        .flower-hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23ffffff" fill-opacity="0.1" d="M0,96L48,112C96,128,192,160,288,160C384,160,480,128,576,112C672,96,768,96,864,112C960,128,1056,160,1152,165.3C1248,171,1344,149,1392,138.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') no-repeat bottom;
            background-size: cover;
        }

        .flower-emoji-large {
            font-size: 120px;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .flower-name-large {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .flower-latin {
            font-size: 14px;
            opacity: 0.9;
            font-style: italic;
            position: relative;
            z-index: 1;
        }

        .flower-content {
            padding: 30px;
        }

        .flower-story {
            font-size: 15px;
            line-height: 1.8;
            color: #4a5568;
            margin-bottom: 30px;
        }

        .music-player {
            background: #f7fafc;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .music-title {
            font-size: 13px;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
        }

        .music-info {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .music-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            margin-right: 16px;
            flex-shrink: 0;
        }

        .music-name {
            font-size: 18px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 4px;
        }

        .music-artist {
            font-size: 14px;
            color: #718096;
        }

        .play-button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(240, 147, 251, 0.4);
        }

        .play-button:active {
            transform: scale(0.98);
        }

        .back-button {
            display: inline-block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .nfc-hint {
            text-align: center;
            font-size: 12px;
            color: #a0aec0;
            margin-top: 30px;
            padding: 20px;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="flower-page">
        <div class="flower-hero">
            <div class="flower-emoji-large">🪷</div>
            <h1 class="flower-name-large">荷花</h1>
            <p class="flower-latin">Lotus · Nelumbo nucifera</p>
        </div>

        <div class="flower-content">
            <div class="flower-story">
                <strong>出淤泥而不染，濯清涟而不妖。</strong><br><br>
                荷花，夏日水面上最美的诗篇。清晨的露珠在花瓣上滚动，宛如珍珠。微风过处，清香阵阵，仿佛能洗涤心灵的尘埃。<br><br>
                古人云：「予独爱莲之出淤泥而不染」，这正是荷花最美的品格——在混沌中保持纯净，在喧嚣中守住本心。
            </div>

            <div class="music-player">
                <div class="music-title">🌸 聆听花语</div>
                
                <div class="music-info">
                    <div class="music-icon">🎵</div>
                    <div>
                        <div class="music-name">荷塘月色</div>
                        <div class="music-artist">禅意钢琴 · 3分28秒</div>
                    </div>
                </div>
                
                <button class="play-button" id="playBtn" onclick="toggleMusic()">
                    <span id="btnText">▶ 聆听荷花</span>
                </button>
            </div>

            <a href="../index.html" class="back-button">← 返回花朵列表</a>

            <div class="nfc-hint">
                📱 将手机靠近荷花卡片的NFC区域<br>即可自动打开此页面
            </div>
        </div>
    </div>

    <script>
        let isPlaying = false;

        function toggleMusic() {
            const btnText = document.getElementById('btnText');
            
            if (isPlaying) {
                btnText.textContent = '▶ 聆听荷花';
                isPlaying = false;
                console.log('暂停音乐');
            } else {
                btnText.textContent = '⏸ 暂停音乐';
                isPlaying = true;
                console.log('播放荷花音乐');
                alert('🎵 音乐播放功能演示中\n\n实际使用时这里会播放《荷塘月色》钢琴曲');
            }
        }
    </script>
</body>
</html>
