<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桂花 · 听花语</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .flower-page {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            overflow: hidden;
        }

        .flower-hero {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            padding: 60px 30px;
            text-align: center;
            color: white;
            position: relative;
        }

        .flower-emoji-large {
            font-size: 120px;
            margin-bottom: 20px;
        }

        .flower-name-large {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .flower-latin {
            font-size: 14px;
            opacity: 0.9;
            font-style: italic;
        }

        .flower-content {
            padding: 30px;
        }

        .flower-story {
            font-size: 15px;
            line-height: 1.8;
            color: #4a5568;
            margin-bottom: 30px;
        }

        .music-player {
            background: #f7fafc;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .music-title {
            font-size: 13px;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
        }

        .music-info {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .music-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            margin-right: 16px;
        }

        .music-name {
            font-size: 18px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 4px;
        }

        .music-artist {
            font-size: 14px;
            color: #718096;
        }

        .play-button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.4);
        }

        .back-button {
            display: inline-block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .nfc-hint {
            text-align: center;
            font-size: 12px;
            color: #a0aec0;
            margin-top: 30px;
            padding: 20px;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="flower-page">
        <div class="flower-hero">
            <div class="flower-emoji-large">🌼</div>
            <h1 class="flower-name-large">桂花</h1>
            <p class="flower-latin">Osmanthus · Osmanthus fragrans</p>
        </div>

        <div class="flower-content">
            <div class="flower-story">
                <strong>十里桂花香，秋意满人间。</strong><br><br>
                桂花，秋天的信使。金黄的小花藏在绿叶间，不经意间便香飘十里。那份甜润的香气，是记忆里最温暖的秋天味道。<br><br>
                桂花开时，便是团圆时。那份香气里，藏着家的味道，藏着团圆的期盼。
            </div>

            <div class="music-player">
                <div class="music-title">🌼 聆听花语</div>
                
                <div class="music-info">
                    <div class="music-icon">🎶</div>
                    <div>
                        <div class="music-name">桂花落</div>
                        <div class="music-artist">民谣吉他 · 4分12秒</div>
                    </div>
                </div>
                
                <button class="play-button" onclick="alert('🎵 音乐播放功能演示中\n\n实际使用时这里会播放《桂花落》吉他曲')">
                    ▶ 聆听桂花
                </button>
            </div>

            <a href="../index.html" class="back-button">← 返回花朵列表</a>

            <div class="nfc-hint">
                📱 将手机靠近桂花卡片的NFC区域<br>即可自动打开此页面
            </div>
        </div>
    </div>
</body>
</html>
