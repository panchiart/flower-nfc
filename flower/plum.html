<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梅花 · 听花语</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .flower-page {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            overflow: hidden;
        }

        .flower-hero {
            background: linear-gradient(135deg, #f5576c 0%, #e11d48 100%);
            padding: 60px 30px;
            text-align: center;
            color: white;
            position: relative;
        }

        .flower-emoji-large {
            font-size: 120px;
            margin-bottom: 20px;
        }

        .flower-name-large {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .flower-latin {
            font-size: 14px;
            opacity: 0.9;
            font-style: italic;
        }

        .flower-content {
            padding: 30px;
        }

        .flower-story {
            font-size: 15px;
            line-height: 1.8;
            color: #4a5568;
            margin-bottom: 30px;
        }

        .music-player {
            background: #f7fafc;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .music-title {
            font-size: 13px;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
        }

        .music-info {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .music-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #f5576c 0%, #e11d48 100%);
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            margin-right: 16px;
        }

        .music-name {
            font-size: 18px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 4px;
        }

        .music-artist {
            font-size: 14px;
            color: #718096;
        }

        .play-button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #f5576c 0%, #e11d48 100%);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(245, 87, 108, 0.4);
        }

        .back-button {
            display: inline-block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .nfc-hint {
            text-align: center;
            font-size: 12px;
            color: #a0aec0;
            margin-top: 30px;
            padding: 20px;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="flower-page">
        <div class="flower-hero">
            <div class="flower-emoji-large">🌸</div>
            <h1 class="flower-name-large">梅花</h1>
            <p class="flower-latin">Plum Blossom · Prunus mume</p>
        </div>

        <div class="flower-content">
            <div class="flower-story">
                <strong>墙角数枝梅，凌寒独自开。</strong><br><br>
                梅花，冬日里最倔强的守望者。当万物沉睡，它却迎着风雪绽放。那份清冷中的坚韧，是华夏民族精神的写照。<br><br>
                梅花开时，春天便不远了。那份暗香里，藏着希望，藏着生机，藏着不屈的傲骨。
            </div>

            <div class="music-player">
                <div class="music-title">🌸 聆听花语</div>
                
                <div class="music-info">
                    <div class="music-icon">🎼</div>
                    <div>
                        <div class="music-name">梅花三弄</div>
                        <div class="music-artist">古琴独奏 · 5分47秒</div>
                    </div>
                </div>
                
                <button class="play-button" onclick="alert('🎵 音乐播放功能演示中\n\n实际使用时这里会播放《梅花三弄》古琴曲')">
                    ▶ 聆听梅花
                </button>
            </div>

            <a href="../index.html" class="back-button">← 返回花朵列表</a>

            <div class="nfc-hint">
                📱 将手机靠近梅花卡片的NFC区域<br>即可自动打开此页面
            </div>
        </div>
    </div>
</body>
</html>
