<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>花叙 · 植物音乐图鉴</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Noto Serif SC', 'Noto Sans SC', serif;
      background: #FDFCFA;
      color: #3D3D3D;
      line-height: 1.7;
      overflow-x: hidden;
    }
    :root {
      --paper:      #FDFCFA;
      --paper-dark: #F5F3EF;
      --ink:        #3D3D3D;
      --ink-light:  #6B6B6B;
      --ink-muted:  #9A9A9A;
      --accent:     #C4927E;
      --accent-light: #D9B8A8;
      --green:      #8B9E7E;
      --border:     #E8E5E0;
    }
    .latin {
      font-family: 'Cormorant Garamond', 'Times New Roman', serif;
      font-style: italic;
      font-weight: 300;
      letter-spacing: 0.02em;
    }

    /* ── Nav ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 0 48px;
      display: flex; justify-content: space-between; align-items: center;
      height: 56px;
      background: rgba(253, 252, 250, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    nav .brand {
      font-size: 15px;
      letter-spacing: 0.12em;
      color: var(--ink);
    }
    nav ul { list-style: none; display: flex; gap: 32px; }
    nav ul li a {
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      transition: color 0.2s;
    }
    nav ul li a:hover { color: var(--ink); }

    /* ── Hero ── */
    .hero {
      min-height: 100vh;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center;
      padding: 0 24px;
      position: relative;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 40%, rgba(196,146,126,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 80% 70%, rgba(139,158,126,0.06) 0%, transparent 60%);
      pointer-events: none;
    }
    .hero-badge {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-muted);
      border: 1px solid var(--border);
      padding: 6px 16px;
      border-radius: 24px;
      margin-bottom: 32px;
    }
    .hero h1 {
      font-size: clamp(28px, 5vw, 52px);
      font-weight: 300;
      letter-spacing: 0.25em;
      color: var(--ink);
      margin-bottom: 16px;
    }
    .hero .subtitle {
      font-size: 14px;
      font-weight: 300;
      color: var(--ink-light);
      letter-spacing: 0.15em;
      margin-bottom: 48px;
    }
    .hero-ornament {
      width: 1px;
      height: 60px;
      background: linear-gradient(to bottom, transparent, var(--ink-muted), transparent);
      margin-bottom: 32px;
      opacity: 0.4;
    }
    .scroll-hint {
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--ink-muted);
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: translateY(0); }
      50% { opacity: 0.8; transform: translateY(4px); }
    }

    /* ── Section Titles ── */
    .section-title {
      text-align: center;
      margin-bottom: 56px;
    }
    .section-title h2 {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 0.2em;
      color: var(--ink);
    }
    .section-title p {
      font-size: 12px;
      color: var(--ink-muted);
      margin-top: 8px;
      letter-spacing: 0.1em;
    }

    /* ── Herbarium Grid ── */
    #herbarium {
      padding: 80px 48px 100px;
      max-width: 960px;
      margin: 0 auto;
    }
    .herbarium-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2px;
    }
    .herbarium-card {
      position: relative;
      background: var(--paper-dark);
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 4/5;
    }
    .herbarium-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .herbarium-card:hover img { transform: scale(1.04); }
    .herbarium-card .card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(61,61,61,0.7) 0%, transparent 50%);
      display: flex; flex-direction: column;
      justify-content: flex-end;
      padding: 24px 20px;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .herbarium-card:hover .card-overlay { opacity: 1; }
    .card-overlay .card-name {
      font-size: 18px;
      font-weight: 300;
      color: #fff;
      letter-spacing: 0.2em;
      margin-bottom: 2px;
    }
    .card-overlay .card-latin {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 8px;
    }
    .card-overlay .card-tag {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.1em;
    }
    .card-play-btn {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 52px; height: 52px;
      background: rgba(255,255,255,0.9);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity 0.4s, transform 0.4s;
      pointer-events: none;
    }
    .herbarium-card:hover .card-play-btn {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    .card-play-btn svg { width: 20px; height: 20px; color: var(--ink); }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 48px 24px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--ink-muted);
      letter-spacing: 0.08em;
    }
    footer a { color: var(--ink-muted); text-decoration: none; }
    footer a:hover { color: var(--ink); }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(253,252,250,0.96);
      backdrop-filter: blur(16px);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--paper);
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid var(--border);
      position: relative;
    }
    .modal-close {
      position: absolute; top: 16px; right: 16px; z-index: 10;
      width: 36px; height: 36px;
      background: var(--paper-dark);
      border: 1px solid var(--border);
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      color: var(--ink-muted);
      transition: background 0.2s;
    }
    .modal-close:hover { background: var(--border); }
    .modal-img-wrap {
      width: 100%;
      height: 280px;
      overflow: hidden;
    }
    .modal-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .modal-body { padding: 32px; }
    .modal-flower-name {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 0.2em;
      color: var(--ink);
      margin-bottom: 4px;
    }
    .modal-latin {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 14px;
      color: var(--ink-muted);
      margin-bottom: 16px;
    }
    .modal-meta {
      display: flex; gap: 16px; margin-bottom: 24px;
    }
    .modal-meta span {
      font-size: 11px;
      color: var(--ink-light);
      letter-spacing: 0.08em;
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 12px;
    }
    .modal-divider {
      width: 40px; height: 1px;
      background: var(--border);
      margin: 24px 0;
    }
    .modal-desc {
      font-size: 13px;
      font-weight: 300;
      color: var(--ink-light);
      line-height: 2;
      margin-bottom: 32px;
    }

    /* ── Audio Player ── */
    .audio-player {
      background: var(--paper-dark);
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 4px;
    }
    .audio-player-header {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .audio-player-title {
      font-size: 13px;
      color: var(--ink-light);
      letter-spacing: 0.05em;
    }
    .audio-waveform {
      display: flex; align-items: center;
      gap: 2px; height: 32px;
      margin-bottom: 16px;
    }
    .waveform-bar {
      flex: 1;
      background: var(--border);
      border-radius: 2px;
      transition: background 0.2s;
      min-height: 4px;
    }
    .waveform-bar.active { background: var(--accent); }
    .audio-controls {
      display: flex; align-items: center;
      gap: 16px;
    }
    .play-btn {
      width: 48px; height: 48px;
      background: var(--ink);
      border: none; border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.1s;
      flex-shrink: 0;
    }
    .play-btn:hover { background: var(--ink-light); }
    .play-btn:active { transform: scale(0.96); }
    .play-btn svg { width: 18px; height: 18px; color: white; }
    .audio-info { flex: 1; }
    .audio-track-name {
      font-size: 14px;
      font-weight: 400;
      color: var(--ink);
      letter-spacing: 0.05em;
    }
    .audio-composer {
      font-size: 11px;
      color: var(--ink-muted);
      margin-top: 2px;
    }
    .audio-time {
      font-size: 12px;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.05em;
    }
    .sound-hint {
      font-size: 11px;
      color: var(--ink-muted);
      text-align: center;
      margin-top: 12px;
      letter-spacing: 0.05em;
    }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      nav { padding: 0 20px; }
      nav ul { gap: 20px; }
      #herbarium { padding: 60px 20px 80px; }
      .herbarium-grid { grid-template-columns: 1fr; gap: 2px; }
      .herbarium-card { aspect-ratio: 4/3; }
      .hero h1 { font-size: 28px; }
      .modal-img-wrap { height: 220px; }
      .modal-body { padding: 24px; }
    }
  </style>
</head>

<!-- Nav -->
<nav>
  <div class="brand">花 叙</div>
  <ul>
    <li><a href="#herbarium">图鉴</a></li>
    <li><a href="contact.html">联系</a></li>
  </ul>
</nav>

<!-- Hero -->
<section class="hero">
  <div class="hero-badge">植物音乐图鉴</div>

  </div>

<footer>
  <p>© 2026 Panchi · 植物音乐图鉴</p>

  <div class="modal" id="modal">

    <div class="modal-img-wrap">
      <img id="modal-img" src="" alt="">
    </div>
    <div class="modal-body">
      <div class="modal-flower-name" id="modal-name"></div>
      <div class="modal-latin" id="modal-latin"></div>
      <div class="modal-meta" id="modal-meta"></div>

      <!-- Audio Player -->
      <div class="audio-player">

            </svg>
          </button>

            <div class="audio-track-name" id="trackName"></div>
            <div class="audio-composer" id="trackComposer"></div>
          </div>
          <div class="audio-time" id="audioTime">0:00</div>
        </div>
      </div>
      <p class="sound-hint" id="soundHint">点击播放按钮，聆听专属花曲</p>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// Flower Data
// ─────────────────────────────────────────────
const flowers = [
  {
    id: 'lotus',
    name: '荷',
    latin: 'Nelumbo nucifera',
    nameFull: '荷花',
    seasons: ['夏季', '花期6-9月'],
    tags: ['清雅', '禅意'],
    image: 'images/hehua-card.jpg',
    modalImage: 'images/hehua-modal.jpg',
    desc: '出淤泥而不染，濯清涟而不妖。荷花承载着东方文化中对纯洁与超脱的向往，古琴与水声交织的旋律将带你进入一片宁静的荷塘。',
    trackName: '荷塘月色',
    trackComposer: 'AI 氛围生成'
  },
  {
    id: 'osmanthus',
    name: '桂',
    latin: 'Osmanthus fragrans',
    nameFull: '桂花',
    seasons: ['秋季', '花期9-10月'],
    tags: ['温柔', '团圆'],
    image: 'images/guihua-card.jpg',
    modalImage: 'images/guihua-modal.jpg',
    desc: '桂香浮动，秋意渐浓。桂花是中国传统十大名花之一，花香清可绝尘，浓能远溢。如风铃轻摇，五声音阶诉说着金秋的故事。',
    trackName: '金桂飘香',
    trackComposer: 'AI 氛围生成'
  },
  {
    id: 'plum',
    name: '梅',
    latin: 'Prunus mume',
    nameFull: '梅花',
    seasons: ['冬季', '花期1-3月'],
    tags: ['傲骨', '坚韧'],
    image: 'images/meihua-card.jpg',
    modalImage: 'images/meihua-modal.jpg',
    desc: '墙角数枝梅，临寒独自开。梅花是中国十大名花之首，以清癯见长，象征着坚韧与高洁。竹笛的悠扬将冬日的静谧缓缓吹来。',
    trackName: '寒梅傲雪',
    trackComposer: 'AI 氛围生成'
  }
];

// ─────────────────────────────────────────────
// Build Grid
// ─────────────────────────────────────────────
const grid = document.getElementById('herbariumGrid');
flowers.forEach(f => {
  const card = document.createElement('div');
  card.className = 'herbarium-card';
  card.innerHTML = `
    <img src="${f.image}" alt="${f.nameFull}" loading="lazy">
    <div class="card-overlay">
      <div class="card-name">${f.nameFull}</div>
      <div class="card-latin">${f.latin}</div>
      <div class="card-tag">${f.tags.join(' · ')} · 点击聆听</div>
    </div>
    <div class="card-play-btn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </div>
  `;
  card.addEventListener('click', () => openModal(f));
  grid.appendChild(card);
});

// ─────────────────────────────────────────────
// Modal
// ─────────────────────────────────────────────
let currentFlower = null;
let isPlaying = false;
let audioCtx = null;
let animationId = null;
let activeOscillators = [];

const modalOverlay = document.getElementById('modalOverlay');
const modalClose = document.getElementById('modalClose');
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const soundHint = document.getElementById('soundHint');

// Build waveform bars
const BARS = 40;
for (let i = 0; i < BARS; i++) {
  const bar = document.createElement('div');
  bar.className = 'waveform-bar';
  bar.style.height = (Math.random() * 20 + 8) + 'px';
  waveform.appendChild(bar);
}

function openModal(f) {
  currentFlower = f;
  document.getElementById('modal-img').src = f.modalImage || f.image;
  document.getElementById('modal-name').textContent = f.nameFull;
  document.getElementById('modal-latin').textContent = f.latin;
  document.getElementById('modal-meta').innerHTML =
    f.seasons.map(s => `<span>${s}</span>`).join('') +
    f.tags.map(t => `<span>${t}</span>`).join('');
  document.getElementById('modal-desc').textContent = f.desc;
  document.getElementById('trackName').textContent = f.trackName;
  document.getElementById('trackComposer').textContent = f.trackComposer;

  isPlaying = false;
  resetPlayBtn();
  stopAllAudio();

  modalOverlay.classList.add('open');
  soundHint.textContent = '点击播放按钮，聆听专属花曲';
}

modalClose.addEventListener('click', () => {
  modalOverlay.classList.remove('open');
  stopAllAudio();
});

modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) {
    modalOverlay.classList.remove('open');
    stopAllAudio();
  }
});

function resetPlayBtn() {
  playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
}

// ─────────────────────────────────────────────
// Play Button Click
// ─────────────────────────────────────────────
playBtn.addEventListener('click', () => {
  if (isPlaying) {
    stopAllAudio();
    isPlaying = false;
    resetPlayBtn();
    soundHint.textContent = '点击播放按钮，重新聆听';
  } else {
    stopAllAudio();
    playFlowerAudio(currentFlower.id);
    isPlaying = true;
    playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
    startWaveAnimation();
    soundHint.textContent = '♪ 正在播放...';
  }
});

// ─────────────────────────────────────────────
// Web Audio Engine
// ─────────────────────────────────────────────
function stopAllAudio() {
  cancelAnimationFrame(animationId);
  activeOscillators.forEach(o => {
    try { o.stop(); } catch(e) {}
  });
  activeOscillators = [];
  if (audioCtx) {
    try { audioCtx.close(); } catch(e) {}
    audioCtx = null;
  }
  resetWaveform();
}

function resetWaveform() {
  document.querySelectorAll('.waveform-bar').forEach(bar => {
    bar.style.height = (Math.random() * 16 + 6) + 'px';
    bar.classList.remove('active');
  });
}

function startWaveAnimation() {
  const bars = document.querySelectorAll('.waveform-bar');
  function animate() {
    if (!isPlaying) return;
    bars.forEach((bar, i) => {
      const h = Math.abs(Math.sin(Date.now() / 300 + i * 0.3)) * 24 + 6;
      bar.style.height = h + 'px';
      bar.classList.add('active');
    });
    animationId = requestAnimationFrame(animate);
  }
  animate();
}

// ─────────────────────────────────────────────
// Flower-Specific Audio Generators
// ─────────────────────────────────────────────
function playFlowerAudio(flowerId) {
  // Create fresh AudioContext
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  
  // Resume if suspended (iOS/Safari requirement)
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }

  const masterGain = audioCtx.createGain();
  masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
  masterGain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 2);
  masterGain.connect(audioCtx.destination);

  console.log('🎵 Playing:', flowerId, '| State:', audioCtx.state);

  if (flowerId === 'lotus') {
    playLotusMusic(masterGain);
  } else if (flowerId === 'osmanthus') {
    playOsmanthusMusic(masterGain);
  } else if (flowerId === 'plum') {
    playPlumMusic(masterGain);
  }
}

// ── Lotus: Peaceful pentatonic drone with water droplets ──
function playLotusMusic(dest) {
  // Pentatonic D: D E F# A B
  const scale = [293.66, 329.63, 369.99, 440.00, 493.88, 587.33];
  
  // Main drone notes
  scale.slice(0, 4).forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sine';
    osc.frequency.value = freq;
    
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.08 - i * 0.015, audioCtx.currentTime + 2);
    
    osc.connect(gain);
    gain.connect(dest);
    osc.start();
    osc.stop(audioCtx.currentTime + 18);
    activeOscillators.push(osc);
  });

  // Water droplet sounds
  const dropInterval = setInterval(() => {
    if (!isPlaying || activeOscillators.length > 10) return;
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    const dropFreq = 600 + Math.random() * 800;
    osc.type = 'sine';
    osc.frequency.setValueAtTime(dropFreq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(dropFreq * 0.4, audioCtx.currentTime + 0.3);
    
    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
    
    osc.connect(gain);
    gain.connect(dest);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.5);
  }, 600);

  setTimeout(() => clearInterval(dropInterval), 16000);
}

// ── Osmanthus: Wind chimes with gentle pentatonic melody ──
function playOsmanthusMusic(dest) {
  // Pentatonic G: G A B D E
  const scale = [392.00, 440.00, 493.88, 587.33, 659.25, 783.99];
  
  // Pad layer
  scale.slice(0, 3).forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'triangle';
    osc.frequency.value = freq;
    
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 2 + i * 0.5);
    
    osc.connect(gain);
    gain.connect(dest);
    osc.start();
    osc.stop(audioCtx.currentTime + 20);
    activeOscillators.push(osc);
  });

  // Chime arpeggio
  let noteIndex = 0;
  const chimeInterval = setInterval(() => {
    if (!isPlaying) return;
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    const freq = scale[noteIndex % scale.length];
    osc.type = 'sine';
    osc.frequency.value = freq;
    
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.5);
    
    osc.connect(gain);
    gain.connect(dest);
    osc.start();
    osc.stop(audioCtx.currentTime + 2);
    
    noteIndex++;
  }, 500);

  setTimeout(() => clearInterval(chimeInterval), 18000);
}

// ── Plum: Bamboo flute with winter atmosphere ──
function playPlumMusic(dest) {
  // Pentatonic C: C D E G A
  const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
  
  // Low pad drone
  scale.slice(0, 3).forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    
    osc.type = 'sawtooth';
    osc.frequency.value = freq;
    
    filter.type = 'lowpass';
    filter.frequency.value = 600;
    
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 3);
    
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(dest);
    osc.start();
    osc.stop(audioCtx.currentTime + 16);
    activeOscillators.push(osc);
  });

  // Flute melody phrases
  let phraseIndex = 0;
  const phrases = [[0, 2, 4, 5], [4, 3, 2, 0], [2, 4, 5, 4]];
  
  const melodyInterval = setInterval(() => {
    if (!isPlaying) return;
    
    const phrase = phrases[phraseIndex % phrases.length];
    phrase.forEach((noteIdx, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'triangle';
      osc.frequency.value = scale[noteIdx] * (phraseIndex % 2 === 0 ? 1 : 2);
      
      const t = audioCtx.currentTime + i * 0.4;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.12, t + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      
      // Gentle vibrato
      const vib = audioCtx.createOscillator();
      const vibGain = audioCtx.createGain();
      vib.frequency.value = 5;
      vibGain.gain.value = 3;
      vib.connect(vibGain);
      vibGain.connect(osc.frequency);
      vib.start(t);
      vib.stop(t + 0.7);
      
      osc.connect(gain);
      gain.connect(dest);
      osc.start(t);
      osc.stop(t + 0.8);
    });
    
    phraseIndex++;
  }, 2500);

  setTimeout(() => clearInterval(melodyInterval), 15000);
}

// ─────────────────────────────────────────────
// NFC Auto-Play via URL params
// ─────────────────────────────────────────────
(function autoPlayFromURL() {
  const params = new URLSearchParams(window.location.search);
  const flowerParam = params.get('flower');
  if (flowerParam) {
    const f = flowers.find(f => f.id === flowerParam);
    if (f) {
      setTimeout(() => {
        openModal(f);
        // Auto-play after a brief delay
        setTimeout(() => {
          stopAllAudio();
          playFlowerAudio(f.id);
          isPlaying = true;
          playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
          startWaveAnimation();
          soundHint.textContent = '♪ 正在播放...';
        }, 600);
      }, 400);
    }
  }
})();
