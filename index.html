<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>花叙 · 植物音乐图鉴</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Noto Serif SC', 'Noto Sans SC', serif;
      background: #FDFCFA;
      color: #3D3D3D;
      line-height: 1.7;
      overflow-x: hidden;
    }

    :root {
      --paper:      #FDFCFA;
      --paper-dark: #F5F3EF;
      --ink:        #3D3D3D;
      --ink-light:  #6B6B6B;
      --ink-muted:  #9A9A9A;
      --accent:     #C4927E;
      --green:      #8B9E7E;
      --border:     #E8E5E0;
    }

    .latin {
      font-family: 'Cormorant Garamond', 'Times New Roman', serif;
      font-style: italic;
      font-weight: 300;
      letter-spacing: 0.02em;
    }

    /* Nav */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 0 24px;
      display: flex; justify-content: space-between; align-items: center;
      height: 56px;
      background: rgba(253, 252, 250, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    nav .brand { font-size: 14px; letter-spacing: 0.15em; color: var(--ink); }
    nav ul { list-style: none; display: flex; gap: 24px; }
    nav ul li a {
      text-decoration: none; font-size: 12px; letter-spacing: 0.08em;
      color: var(--ink-muted); transition: color 0.2s;
    }
    nav ul li a:hover { color: var(--ink); }

    /* Hero */
    .hero {
      min-height: 100vh;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; padding: 0 24px; position: relative;
    }
    .hero::before {
      content: ''; position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 40%, rgba(196,146,126,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 80% 70%, rgba(139,158,126,0.06) 0%, transparent 60%);
      pointer-events: none;
    }
    .hero-badge {
      display: inline-block; font-size: 10px; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--ink-muted);
      border: 1px solid var(--border); padding: 6px 16px;
      border-radius: 24px; margin-bottom: 28px;
    }
    .hero h1 {
      font-size: clamp(24px, 6vw, 48px); font-weight: 300;
      letter-spacing: 0.3em; color: var(--ink); margin-bottom: 12px;
    }
    .hero .subtitle {
      font-size: 13px; font-weight: 300;
      color: var(--ink-light); letter-spacing: 0.15em; margin-bottom: 40px;
    }
    .hero-ornament {
      width: 1px; height: 50px;
      background: linear-gradient(to bottom, transparent, var(--ink-muted), transparent);
      margin-bottom: 28px; opacity: 0.4;
    }
    .scroll-hint {
      font-size: 10px; letter-spacing: 0.15em;
      color: var(--ink-muted); animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: translateY(0); }
      50% { opacity: 0.7; transform: translateY(3px); }
    }

    /* Section */
    .section-title { text-align: center; margin-bottom: 48px; }
    .section-title h2 { font-size: 20px; font-weight: 300; letter-spacing: 0.2em; color: var(--ink); }
    .section-title p { font-size: 11px; color: var(--ink-muted); margin-top: 6px; letter-spacing: 0.1em; }

    /* Herbarium Grid - 植物图鉴风格 */
    #herbarium { padding: 72px 20px 96px; max-width: 720px; margin: 0 auto; }
    
    .herbarium-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .specimen-card {
      background: var(--paper);
      border: 1px solid var(--border);
      padding: 20px;
      display: flex;
      gap: 20px;
      cursor: pointer;
      transition: box-shadow 0.3s, transform 0.2s;
    }
    .specimen-card:hover {
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      transform: translateY(-2px);
    }
    .specimen-card:active {
      transform: scale(0.98);
    }

    .specimen-image {
      width: 100px;
      height: 130px;
      flex-shrink: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--paper-dark);
    }
    .specimen-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .specimen-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px 0;
    }

    .specimen-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .specimen-name {
      font-size: 20px;
      font-weight: 300;
      letter-spacing: 0.15em;
      color: var(--ink);
    }
    .specimen-name-en {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 12px;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    .play-icon {
      width: 36px;
      height: 36px;
      background: var(--ink);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .play-icon svg {
      width: 14px;
      height: 14px;
      color: white;
      margin-left: 2px;
    }

    .specimen-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .specimen-meta span {
      font-size: 10px;
      color: var(--ink-muted);
      letter-spacing: 0.05em;
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 10px;
    }

    .specimen-desc {
      font-size: 11px;
      color: var(--ink-light);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Footer */
    footer {
      text-align: center; padding: 40px 24px;
      border-top: 1px solid var(--border);
      font-size: 10px; color: var(--ink-muted); letter-spacing: 0.08em;
    }
    footer a { color: var(--ink-muted); text-decoration: none; }
    footer a:hover { color: var(--ink); }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(253,252,250,0.98);
      display: flex; align-items: center; justify-content: center;
      padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--paper); width: 100%; max-width: 480px;
      max-height: 90vh; overflow-y: auto;
      border: 1px solid var(--border); position: relative;
    }
    .modal-close {
      position: absolute; top: 12px; right: 12px; z-index: 10;
      width: 32px; height: 32px; background: var(--paper-dark);
      border: 1px solid var(--border); border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: var(--ink-muted);
    }
    .modal-close:hover { background: var(--border); }
    
    .modal-img-wrap { width: 100%; height: 240px; overflow: hidden; }
    .modal-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .modal-body { padding: 24px; }
    
    .modal-name { font-size: 24px; font-weight: 300; letter-spacing: 0.2em; color: var(--ink); margin-bottom: 4px; }
    .modal-latin { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 13px; color: var(--ink-muted); margin-bottom: 12px; }
    .modal-meta { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .modal-meta span { font-size: 10px; color: var(--ink-light); letter-spacing: 0.06em; border: 1px solid var(--border); padding: 4px 12px; border-radius: 12px; }
    .modal-divider { width: 32px; height: 1px; background: var(--border); margin: 16px 0; }
    .modal-desc { font-size: 12px; font-weight: 300; color: var(--ink-light); line-height: 2; margin-bottom: 24px; }

    /* Audio Player */
    .audio-player {
      background: var(--paper-dark); border: 1px solid var(--border);
      padding: 20px; border-radius: 4px;
    }
    .audio-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .audio-title { font-size: 12px; color: var(--ink-light); letter-spacing: 0.05em; }
    
    .audio-visualizer {
      display: flex; align-items: flex-end; justify-content: center;
      gap: 3px; height: 40px; margin-bottom: 14px;
      padding: 8px 0;
    }
    .visualizer-bar {
      width: 4px; background: var(--border); border-radius: 2px;
      transition: height 0.15s ease-out, background 0.2s;
    }
    .visualizer-bar.active { background: var(--accent); }

    .audio-controls {
      display: flex; align-items: center; gap: 14px;
    }
    
    .big-play-btn {
      width: 52px; height: 52px;
      background: var(--ink); border: none; border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.15s;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .big-play-btn:hover { background: var(--ink-light); }
    .big-play-btn:active { transform: scale(0.94); }
    .big-play-btn svg { width: 20px; height: 20px; color: white; }
    .big-play-btn .pause-icon { display: none; }
    .big-play-btn.playing .play-icon { display: none; }
    .big-play-btn.playing .pause-icon { display: block; }

    .audio-info { flex: 1; min-width: 0; }
    .audio-track { font-size: 13px; font-weight: 400; color: var(--ink); letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .audio-artist { font-size: 10px; color: var(--ink-muted); margin-top: 2px; }

    .audio-time { font-size: 11px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }

    .volume-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
    .volume-icon { width: 16px; height: 16px; color: var(--ink-muted); flex-shrink: 0; }
    .volume-slider {
      flex: 1; height: 4px; -webkit-appearance: none; appearance: none;
      background: var(--border); border-radius: 2px; cursor: pointer;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      background: var(--ink); border-radius: 50%; cursor: pointer;
    }

    .sound-hint {
      font-size: 10px; color: var(--ink-muted);
      text-align: center; margin-top: 12px; letter-spacing: 0.04em;
    }

    /* Toast */
    .toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--ink); color: white;
      font-size: 11px; padding: 10px 18px;
      border-radius: 20px; z-index: 9999;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (min-width: 640px) {
      #herbarium { padding: 80px 40px 100px; }
      .herbarium-grid { gap: 24px; }
      .specimen-card { padding: 24px; gap: 24px; }
      .specimen-image { width: 120px; height: 150px; }
      .specimen-name { font-size: 22px; }
    }
  </style>
</head>
<body>

<nav>
  <div class="brand">花 叙</div>
  <ul>
    <li><a href="#herbarium">图鉴</a></li>
    <li><a href="contact.html">联系</a></li>
  </ul>
</nav>

<section class="hero">
  <div class="hero-badge">植物音乐图鉴</div>
  <h1>Herbarium Musica</h1>

</section>

<footer><p>© 2026 Panchi · 植物音乐图鉴</p></footer>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">✕</button>

      <div class="modal-name" id="modal-name"></div>
      <div class="modal-latin" id="modal-latin"></div>
      <div class="modal-meta" id="modal-meta"></div>
      <div class="modal-divider"></div>
      <p class="modal-desc" id="modal-desc"></p>

      <div class="audio-player">
        <div class="audio-header"><span class="audio-title">自然声景</span></div>

        <div class="audio-controls">
          <button class="big-play-btn" id="bigPlayBtn">
            <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>
          <div class="audio-info">
            <div class="audio-track" id="audioTrack"></div>
            <div class="audio-artist" id="audioArtist"></div>
          </div>
          <div class="audio-time" id="audioTime">0:00</div>
        </div>
        <div class="volume-row">
          <svg class="volume-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
          <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="50">
        </div>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─────────────────────────────────────────────
// Flower Data
// ─────────────────────────────────────────────
const flowers = [
  {
    id: 'lotus',
    name: '荷',
    nameFull: '荷花',
    nameEn: 'Lotus',
    latin: 'Nelumbo nucifera',
    seasons: ['夏季', '花期6-9月'],
    tags: ['清雅', '禅意'],
    image: 'images/hehua-card.jpg',
    modalImage: 'images/hehua-modal.jpg',
    desc: '出淤泥而不染，濯清涟而不妖。细雨落在荷塘，水滴敲击叶面，自然的白噪声带你进入宁静。',
    track: '荷塘细雨',
    artist: '自然声景 · 助眠'
  },
  {
    id: 'osmanthus',
    name: '桂',
    nameFull: '桂花',
    nameEn: 'Osmanthus',
    latin: 'Osmanthus fragrans',
    seasons: ['秋季', '花期9-10月'],
    tags: ['温柔', '团圆'],
    image: 'images/guihua-card.jpg',
    modalImage: 'images/guihua-modal.jpg',
    desc: '桂香浮动，秋意渐浓。微风穿过树叶的沙沙声，伴着远处的鸟鸣，是最温柔的疗愈。',
    track: '秋日微风',
    artist: '自然声景 · 放松'
  },
  {
    id: 'plum',
    name: '梅',
    nameFull: '梅花',
    nameEn: 'Plum Blossom',
    latin: 'Prunus mume',
    seasons: ['冬季', '花期1-3月'],
    tags: ['傲骨', '坚韧'],
    image: 'images/meihua-card.jpg',
    modalImage: 'images/meihua-modal.jpg',
    desc: '墙角数枝梅，临寒独自开。雪夜般的寂静，只有极轻的风声，让心灵归于平静。',
    track: '雪夜寂静',
    artist: '自然声景 · 冥想'
  }
];

// ─────────────────────────────────────────────
// Build Grid
// ─────────────────────────────────────────────
const grid = document.getElementById('herbariumGrid');
flowers.forEach(f => {
  const card = document.createElement('div');
  card.className = 'specimen-card';
  card.innerHTML = `
    <div class="specimen-image"><img src="${f.image}" alt="${f.nameFull}" loading="lazy"></div>
    <div class="specimen-info">
      <div class="specimen-header">
        <div>
          <div class="specimen-name">${f.nameFull} <span class="latin">${f.nameEn}</span></div>
          <div class="specimen-name latin">${f.latin}</div>
        </div>
        <div class="play-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
      </div>
      <div class="specimen-meta">
        ${f.seasons.map(s => `<span>${s}</span>`).join('')}
        ${f.tags.map(t => `<span>${t}</span>`).join('')}
      </div>
      <div class="specimen-desc">${f.desc}</div>
    </div>
  `;
  card.addEventListener('click', () => openModal(f));
  grid.appendChild(card);
});

// ─────────────────────────────────────────────
// Modal
// ─────────────────────────────────────────────
let currentFlower = null;
let isPlaying = false;
let audioCtx = null;
let masterGain = null;
let animationId = null;
let activeNodes = [];

const modalOverlay = document.getElementById('modalOverlay');
const modalClose = document.getElementById('modalClose');
const bigPlayBtn = document.getElementById('bigPlayBtn');
const volumeSlider = document.getElementById('volumeSlider');
const visualizer = document.getElementById('visualizer');
const soundHint = document.getElementById('soundHint');

// Build visualizer bars
for (let i = 0; i < 24; i++) {
  const bar = document.createElement('div');
  bar.className = 'visualizer-bar';
  bar.style.height = '4px';
  visualizer.appendChild(bar);
}

function openModal(f) {
  currentFlower = f;
  document.getElementById('modal-img').src = f.modalImage || f.image;
  document.getElementById('modal-name').textContent = `${f.nameFull} · ${f.nameEn}`;
  document.getElementById('modal-latin').textContent = f.latin;
  document.getElementById('modal-meta').innerHTML = f.seasons.map(s => `<span>${s}</span>`).join('') + f.tags.map(t => `<span>${t}</span>`).join('');
  document.getElementById('modal-desc').textContent = f.desc;
  document.getElementById('audioTrack').textContent = f.track;
  document.getElementById('audioArtist').textContent = f.artist;

  isPlaying = false;
  stopAllAudio();
  bigPlayBtn.classList.remove('playing');
  resetVisualizer();

  modalOverlay.classList.add('open');
  soundHint.textContent = '点击播放按钮，聆听自然声景';
}

modalClose.addEventListener('click', () => {
  modalOverlay.classList.remove('open');
  stopAllAudio();
});

modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) {
    modalOverlay.classList.remove('open');
    stopAllAudio();
  }
});

function resetVisualizer() {
  document.querySelectorAll('.visualizer-bar').forEach(bar => {
    bar.style.height = '4px';
    bar.classList.remove('active');
  });
}

// ─────────────────────────────────────────────
// Play Button - 支持触摸设备
// ─────────────────────────────────────────────
bigPlayBtn.addEventListener('click', handlePlayClick);
bigPlayBtn.addEventListener('touchend', function(e) {
  e.preventDefault();
  handlePlayClick();
});

function handlePlayClick() {
  if (isPlaying) {
    stopAllAudio();
    isPlaying = false;
    bigPlayBtn.classList.remove('playing');
    soundHint.textContent = '点击播放按钮，重新聆听';
  } else {
    stopAllAudio();
    // 重要：必须在用户交互中创建 AudioContext
    startNatureSound(currentFlower.id);
    isPlaying = true;
    bigPlayBtn.classList.add('playing');
    startVisualizerAnimation();
    soundHint.textContent = '♪ 正在播放自然声景...';
  }
}

// Volume
volumeSlider.addEventListener('input', () => {
  if (masterGain && audioCtx) {
    masterGain.gain.setValueAtTime(volumeSlider.value / 100 * 0.4, audioCtx.currentTime);
  }
});

// ─────────────────────────────────────────────
// 自然白噪声引擎
// ─────────────────────────────────────────────
function stopAllAudio() {
  cancelAnimationFrame(animationId);
  activeNodes.forEach(node => {
    try { node.stop(); } catch(e) {}
    try { node.disconnect(); } catch(e) {}
  });
  activeNodes = [];
  if (audioCtx) {
    try { audioCtx.close(); } catch(e) {}
    audioCtx = null;
  }
  resetVisualizer();
}

function startVisualizerAnimation() {
  const bars = document.querySelectorAll('.visualizer-bar');
  function animate() {
    if (!isPlaying) return;
    bars.forEach((bar, i) => {
      const h = Math.abs(Math.sin(Date.now() / 350 + i * 0.4)) * 28 + 4;
      bar.style.height = h + 'px';
      bar.classList.add('active');
    });
    animationId = requestAnimationFrame(animate);
  }
  animate();
}

// 创建粉红噪声（更自然）
function createPinkNoise(ctx, duration = 60) {
  const bufferSize = ctx.sampleRate * duration;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);

  let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0;
  for (let i = 0; i < bufferSize; i++) {
    const white = Math.random() * 2 - 1;
    b0 = 0.99886 * b0 + white * 0.0555179;
    b1 = 0.99332 * b1 + white * 0.0750759;
    b2 = 0.96900 * b2 + white * 0.1538520;
    b3 = 0.86650 * b3 + white * 0.3104856;
    b4 = 0.55000 * b4 + white * 0.5329522;
    b5 = -0.7616 * b5 - white * 0.0168980;
    data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + white * 0.5362) * 0.11;
  }
  return buffer;
}

function startNatureSound(flowerId) {
  // Safari 必须在用户交互中创建 AudioContext
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch(e) {
    console.error('AudioContext 创建失败:', e);
    return;
  }
  
  // 强制解锁 Safari 的 AudioContext
  const unlock = () => {
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().then(() => {
        console.log('🔓 Safari AudioContext 已解锁');
      }).catch(err => {
        console.error('解锁失败:', err);
      });
    }
  };
  
  unlock();
  
  // 额外保险：如果还是 suspended，再试一次
  if (audioCtx.state === 'suspended') {
    setTimeout(unlock, 100);
  }

  masterGain = audioCtx.createGain();
  masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
  masterGain.gain.linearRampToValueAtTime(volumeSlider.value / 100 * 0.35, audioCtx.currentTime + 1.5);
  masterGain.connect(audioCtx.destination);

  console.log('🎵 Starting nature sound:', flowerId, '| State:', audioCtx.state, '| SampleRate:', audioCtx.sampleRate);

  if (flowerId === 'lotus') playLotusRain(audioCtx, masterGain);
  else if (flowerId === 'osmanthus') playOsmanthusWind(audioCtx, masterGain);
  else if (flowerId === 'plum') playPlumSilence(audioCtx, masterGain);
}

// ── 荷花：细雨落在荷塘 ──
function playLotusRain(ctx, dest) {
  const noiseBuffer = createPinkNoise(ctx, 60);
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuffer;
  noise.loop = true;

  const highpass = ctx.createBiquadFilter();
  highpass.type = 'highpass';
  highpass.frequency.value = 500;

  const lowpass = ctx.createBiquadFilter();
  lowpass.type = 'lowpass';
  lowpass.frequency.value = 2500;

  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.3, ctx.currentTime);

  noise.connect(highpass);
  highpass.connect(lowpass);
  lowpass.connect(gain);
  gain.connect(dest);
  
  try {
    noise.start(0);
    activeNodes.push(noise);
    console.log('✅ 荷花雨声已启动');
  } catch(e) {
    console.error('启动失败:', e);
  }

  // 水滴
  const dropInterval = setInterval(() => {
    if (!isPlaying || !audioCtx) return;
    playWaterDrop(ctx, dest);
  }, 700 + Math.random() * 1800);

  setTimeout(() => clearInterval(dropInterval), 58000);
}

function playWaterDrop(ctx, dest) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = 'sine';
  const freq = 700 + Math.random() * 500;
  osc.frequency.setValueAtTime(freq, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.35, ctx.currentTime + 0.12);

  gain.gain.setValueAtTime(0.05, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.15);

  osc.connect(gain);
  gain.connect(dest);
  osc.start();
  osc.stop(ctx.currentTime + 0.2);
}

// ── 桂花：微风穿过树叶 ──
function playOsmanthusWind(ctx, dest) {
  const noiseBuffer = createPinkNoise(ctx, 60);
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuffer;
  noise.loop = true;

  const lowpass = ctx.createBiquadFilter();
  lowpass.type = 'lowpass';
  lowpass.frequency.value = 600;

  // LFO 模拟风忽大忽小
  const lfo = ctx.createOscillator();
  const lfoGain = ctx.createGain();
  lfo.type = 'sine';
  lfo.frequency.value = 0.12;
  lfoGain.gain.value = 150;
  lfo.connect(lfoGain);
  lfoGain.connect(lowpass.frequency);
  lfo.start();

  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.22, ctx.currentTime);

  noise.connect(lowpass);
  lowpass.connect(gain);
  gain.connect(dest);
  
  try {
    noise.start(0);
    activeNodes.push(noise);
    console.log('✅ 桂花风声已启动');
  } catch(e) {
    console.error('启动失败:', e);
  }

  // 树叶沙沙
  const rustleInterval = setInterval(() => {
    if (!isPlaying || !audioCtx) return;
    playRustle(ctx, dest);
  }, 250 + Math.random() * 500);

  setTimeout(() => clearInterval(rustleInterval), 58000);

  // 鸟鸣
  const birdInterval = setInterval(() => {
    if (!isPlaying || !audioCtx) return;
    playBirdChirp(ctx, dest);
  }, 3500 + Math.random() * 7000);

  setTimeout(() => clearInterval(birdInterval), 58000);
}

function playRustle(ctx, dest) {
  const bufferSize = Math.floor(ctx.sampleRate * 0.1);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / bufferSize * 6);
  }

  const noise = ctx.createBufferSource();
  noise.buffer = buffer;

  const highpass = ctx.createBiquadFilter();
  highpass.type = 'highpass';
  highpass.frequency.value = 2500;

  const gain = ctx.createGain();
  gain.gain.value = 0.03 + Math.random() * 0.02;

  noise.connect(highpass);
  highpass.connect(gain);
  gain.connect(dest);
  noise.start();
}

function playBirdChirp(ctx, dest) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = 'sine';
  const baseFreq = 2000 + Math.random() * 600;

  osc.frequency.setValueAtTime(baseFreq, ctx.currentTime);
  for (let i = 0; i < 4; i++) {
    osc.frequency.setValueAtTime(baseFreq + Math.random() * 300 - 150, ctx.currentTime + i * 0.04);
  }

  gain.gain.setValueAtTime(0.015, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.2);

  osc.connect(gain);
  gain.connect(dest);
  osc.start();
  osc.stop(ctx.currentTime + 0.25);
}

// ── 梅花：雪夜寂静 ──
function playPlumSilence(ctx, dest) {
  const noiseBuffer = createPinkNoise(ctx, 60);
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuffer;
  noise.loop = true;

  const lowpass = ctx.createBiquadFilter();
  lowpass.type = 'lowpass';
  lowpass.frequency.value = 250;

  const gain = ctx.createGain();
  gain.gain.value = 0.06;

  noise.connect(lowpass);
  lowpass.connect(gain);
  gain.connect(dest);
  try {
    noise.start(0);
    activeNodes.push(noise);
    console.log("✅ 雨声已启动");
  } catch(e) {
    console.error("启动失败:", e);
  }

  // 偶尔的微风
  const breezeInterval = setInterval(() => {
    if (!isPlaying || !audioCtx) return;
    if (Math.random() > 0.65) {
      playSoftBreeze(ctx, dest);
    }
  }, 2500);

  setTimeout(() => clearInterval(breezeInterval), 58000);
}

function playSoftBreeze(ctx, dest) {
  const bufferSize = ctx.sampleRate * 1.5;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);

  for (let i = 0; i < bufferSize; i++) {
    const envelope = Math.sin(i / bufferSize * Math.PI);
    data[i] = (Math.random() * 2 - 1) * envelope * 0.25;
  }

  const noise = ctx.createBufferSource();
  noise.buffer = buffer;

  const lowpass = ctx.createBiquadFilter();
  lowpass.type = 'lowpass';
  lowpass.frequency.value = 350;

  const gain = ctx.createGain();
  gain.gain.value = 0.05;

  noise.connect(lowpass);
  lowpass.connect(gain);
  gain.connect(dest);
  noise.start();
}

// ─────────────────────────────────────────────
// NFC Auto-Play
// ─────────────────────────────────────────────
(function autoPlayFromURL() {
  const params = new URLSearchParams(window.location.search);
  const flowerParam = params.get('flower');
  if (flowerParam) {
    const f = flowers.find(f => f.id === flowerParam);
    if (f) {
      setTimeout(() => {
        openModal(f);
        // 自动播放需要短暂延迟让模态框先打开
        setTimeout(() => {
          stopAllAudio();
          startNatureSound(f.id);
          isPlaying = true;
          bigPlayBtn.classList.add('playing');
          startVisualizerAnimation();
          soundHint.textContent = '♪ 正在播放自然声景...';
        }, 500);
      }, 300);
    }
  }
})();

// Toast
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
