<?xml version="1.0" encoding="UTF-8"?>
<!-- 荷花明信片正面设计 (105x148mm @ 300DPI) -->
<!-- 实际设计尺寸：111x154mm (含出血) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1248 1732" width="1248" height="1732">
  <!-- 背景：渐变粉色 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8bbd0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="lotusGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fce4ec;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="1248" height="1732" fill="url(#bgGrad)"/>
  
  <!-- 装饰元素：水波纹 -->
  <ellipse cx="624" cy="1400" rx="500" ry="50" fill="#f48fb1" opacity="0.3"/>
  <ellipse cx="624" cy="1450" rx="450" ry="40" fill="#f48fb1" opacity="0.2"/>
  <ellipse cx="624" cy="1500" rx="400" ry="30" fill="#f48fb1" opacity="0.1"/>
  
  <!-- 荷叶 -->
  <ellipse cx="300" cy="1200" rx="180" ry="80" fill="#66bb6a" opacity="0.6" transform="rotate(-15 300 1200)"/>
  <ellipse cx="900" cy="1250" rx="150" ry="70" fill="#4caf50" opacity="0.5" transform="rotate(10 900 1250)"/>
  
  <!-- 荷花（简化图形） -->
  <!-- 花瓣 -->
  <ellipse cx="624" cy="700" rx="80" ry="160" fill="url(#lotusGrad)" opacity="0.9"/>
  <ellipse cx="624" cy="700" rx="80" ry="160" fill="url(#lotusGrad)" opacity="0.9" transform="rotate(30 624 700)"/>
  <ellipse cx="624" cy="700" rx="80" ry="160" fill="url(#lotusGrad)" opacity="0.9" transform="rotate(60 624 700)"/>
  <ellipse cx="624" cy="700" rx="80" ry="160" fill="url(#lotusGrad)" opacity="0.9" transform="rotate(90 624 700)"/>
  <ellipse cx="624" cy="700" rx="80" ry="160" fill="url(#lotusGrad)" opacity="0.9" transform="rotate(120 624 700)"/>
  <ellipse cx="624" cy="700" rx="80" ry="160" fill="url(#lotusGrad)" opacity="0.9" transform="rotate(150 624 700)"/>
  <ellipse cx="624" cy="700" rx="80" ry="160" fill="url(#lotusGrad)" opacity="0.9" transform="rotate(180 624 700)"/>
  <ellipse cx="624" cy="700" rx="80" ry="160" fill="url(#lotusGrad)" opacity="0.9" transform="rotate(210 624 700)"/>
  <ellipse cx="624" cy="700" rx="80" ry="160" fill="url(#lotusGrad)" opacity="0.9" transform="rotate(240 624 700)"/>
  <ellipse cx="624" cy="700" rx="80" ry="160" fill="url(#lotusGrad)" opacity="0.9" transform="rotate(270 624 700)"/>
  <ellipse cx="624" cy="700" rx="80" ry="160" fill="url(#lotusGrad)" opacity="0.9" transform="rotate(300 624 700)"/>
  <ellipse cx="624" cy="700" rx="80" ry="160" fill="url(#lotusGrad)" opacity="0.9" transform="rotate(330 624 700)"/>
  
  <!-- 花芯（NFC 标签位置） -->
  <circle cx="624" cy="700" r="60" fill="#fff9c4" opacity="0.8"/>
  <circle cx="624" cy="700" r="40" fill="#fff59d"/>
  
  <!-- 露珠 -->
  <circle cx="580" cy="650" r="12" fill="white" opacity="0.6"/>
  <circle cx="680" cy="720" r="8" fill="white" opacity="0.5"/>
  
  <!-- 标题 -->
  <text x="624" y="300" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="72" font-weight="bold" fill="#c2185b" text-anchor="middle">荷花</text>
  
  <!-- 副标题 -->
  <text x="624" y="370" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="36" fill="#e91e63" text-anchor="middle" font-style="italic">Lotus</text>
  
  <!-- 装饰线 -->
  <line x1="474" y1="400" x2="774" y2="400" stroke="#f48fb1" stroke-width="2" opacity="0.6"/>
  
  <!-- 底部提示（NFC区域） -->
  <text x="624" y="1600" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" fill="#c2185b" text-anchor="middle" opacity="0.7">📱 将手机靠近花朵中央</text>
  
  <!-- 裁切标记（出血线） -->
  <rect x="89" y="89" width="1070" height="1554" fill="none" stroke="#ff0000" stroke-width="1" stroke-dasharray="10,5" opacity="0.3"/>
</svg>